name: Portal GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'site/**'
      - 'python/**'
      - '*.md'
      - 'docs/*.md'
      - 'flight-patterns/**/*.md'
      - 'reference/**/*.md'
      - 'src/main/java/**'
      - 'src/main/resources/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - 'site/**'
      - 'python/**'
      - '*.md'
      - 'docs/*.md'
      - 'flight-patterns/**/*.md'
      - 'reference/**/*.md'
      - 'src/main/java/**'
      - 'src/main/resources/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configure Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Test Java library
        run: ./gradlew test --no-daemon --console=plain

      - name: Generate JavaDoc
        run: ./gradlew javadoc --no-daemon --console=plain

      - name: Install portal dependencies
        working-directory: site
        run: npm ci

      - name: Add JavaDoc to portal
        run: |
          mkdir -p site/public/api/java/latest
          cp -R build/docs/javadoc/. site/public/api/java/latest/

      - name: Build portal
        working-directory: site
        run: npm run build

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
