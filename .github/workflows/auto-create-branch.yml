name: Auto-Create Feature/Bug Branch on Assignment

on:
  issues:
    types: [assigned]

jobs:
  create-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine branch type and create branch
        id: create_branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          # Determine if bug or feature based on labels
          BRANCH_TYPE="feature"
          if [[ "$ISSUE_LABELS" == *"bug"* ]]; then
            BRANCH_TYPE="bugfix"
          fi
          
          # Create slug from issue title (lowercase, replace spaces with hyphens, remove special chars)
          SLUG=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9 -]//g' | sed 's/  */-/g' | cut -c1-40)
          
          # Create branch name
          BRANCH_NAME="${BRANCH_TYPE}/issue-${ISSUE_NUMBER}-${SLUG}"
          
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "branch_type=${BRANCH_TYPE}" >> $GITHUB_OUTPUT
          
          # Create and push branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"
          
          echo "✅ Branch created: $BRANCH_NAME"

      - name: Determine version bump
        id: version
        run: |
          # Get latest release version from git tags
          LATEST_RELEASE=$(git tag -l "v*" | sort -V | tail -1 | sed 's/^v//')
          
          # Parse latest release version components
          MAJOR=$(echo $LATEST_RELEASE | cut -d. -f1)
          MINOR=$(echo $LATEST_RELEASE | cut -d. -f2)
          PATCH=$(echo $LATEST_RELEASE | cut -d. -f3)
          
          # Only bugfix branches get version bumps
          # Feature branches keep main's development version
          NEXT_VERSION=""
          if [[ "${{ steps.create_branch.outputs.branch_type }}" == "bugfix" ]]; then
            NEXT_PATCH=$((PATCH + 1))
            NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
          fi
          
          echo "latest_release=${LATEST_RELEASE}" >> $GITHUB_OUTPUT
          echo "next_version=${NEXT_VERSION}" >> $GITHUB_OUTPUT

      - name: Update version in bugfix branch
        env:
          BRANCH_NAME: ${{ steps.create_branch.outputs.branch_name }}
          BRANCH_TYPE: ${{ steps.create_branch.outputs.branch_type }}
          LATEST_RELEASE: ${{ steps.version.outputs.latest_release }}
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          # Only update version for bugfix branches
          if [[ "$BRANCH_TYPE" != "bugfix" ]]; then
            echo "ℹ️  Feature branch detected - skipping version bump"
            echo "Main development version will be used"
            exit 0
          fi
          
          # Switch to the new branch
          git fetch origin "$BRANCH_NAME"
          git checkout "$BRANCH_NAME"
          
          # Find current version string in build.gradle.kts
          CURRENT_VERSION_STRING=$(grep "else -> \"" build.gradle.kts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+([-\w]+)?')
          
          # Update build.gradle.kts with bugfix version (latest release + 1 patch)
          sed -i "s/else -> \"${CURRENT_VERSION_STRING}\"/else -> \"${NEXT_VERSION}\"/" build.gradle.kts
          
          # Check if file was modified
          if git diff --quiet build.gradle.kts; then
            echo "⚠️  Warning: No changes detected in build.gradle.kts"
            echo "Pattern: else -> \"${CURRENT_VERSION_STRING}\""
            exit 1
          fi
          
          # Commit version bump
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build.gradle.kts
          git commit -m "Bump version to ${NEXT_VERSION} for bugfix (latest release: ${LATEST_RELEASE})"
          git push origin "$BRANCH_NAME"
          
          echo "✅ Bugfix version bumped to ${NEXT_VERSION} (from latest release ${LATEST_RELEASE})"

      - name: Post comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = '${{ steps.create_branch.outputs.branch_name }}';
            const branchType = '${{ steps.create_branch.outputs.branch_type }}';
            const nextVersion = '${{ steps.version.outputs.next_version }}';
            const repoUrl = `https://github.com/${{ github.repository }}`;
            const branchUrl = `${repoUrl}/tree/${branchName}`;
            
            const typeEmoji = branchType === 'bugfix' ? '🐛' : '✨';
            const typeLabel = branchType === 'bugfix' ? 'Bug Fix' : 'Feature';
            
            let versionNote = '';
            if (branchType === 'bugfix' && nextVersion) {
              versionNote = `\n📦 **Version**: \`${nextVersion}\` (bumped from main development version)`;
            } else if (branchType === 'feature') {
              versionNote = `\n📦 **Version**: Uses main development version (no bump for features)`;
            }
            
            const instructions = `${typeEmoji} **${typeLabel} Branch Created**\n\n🌿 **Branch**: [${branchName}](${branchUrl})${versionNote}\n\n**Quick Start**:\n1. Fetch and checkout the branch:\n   \`\`\`bash\n   git fetch origin ${branchName}\n   git checkout ${branchName}\n   \`\`\`\n\n2. Or use one command:\n   \`\`\`bash\n   git checkout --track origin/${branchName}\n   \`\`\`\n\n3. See [Agent Instructions](.github/AGENT_INSTRUCTIONS.md) for full development workflow\n\n4. When ready, push commits and open a PR\n\n**Important Notes**:\n- ${branchType === 'bugfix' ? 'Version already bumped to `' + nextVersion + '` - do not change it' : 'Version remains unchanged - using main development version'}\n- Check out the branch before making any commits\n- This branch is ready for work - all automation complete`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: instructions
            });
